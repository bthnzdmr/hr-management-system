# Gelistirme profili.
#
# Ana application.yml URETIM-GUVENLI varsayilanlar tasir: log sessiz, API
# semasi kapali. Gurultu ve kolaylik OPT-IN'dir ve burada acilir.
#
# Onceki halde tek bir yapilandirma her ortama hizmet ediyordu ve gelistirme
# tercihleri (DEBUG SQL, acik Swagger) dogrudan uretime gidiyordu.
#
# Aktiflestirmek icin: SPRING_PROFILES_ACTIVE=dev
spring:
  jpa:
    properties:
      hibernate:
        # Bicimlendirme her ifadeyi ~12 satira yayiyor. OutboxRelay iki saniyede
        # bir sorgu attigi icin bos bir sistemde dakikada 417 satir olculdu ve
        # hicbiri gercek bir olay degildi: cikan bir INFO satiri gorunmezdi.
        # SQL hala tek satir halinde loglaniyor; guzel bicim tek koşuda acilir.
        format_sql: ${SQL_FORMAT:false}

# Etkilesimli dokumantasyon gelistirmede acik.
springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

logging:
  level:
    # Calisan sorguyu gormek degerlidir ama SURELI degil: OutboxRelay iki
    # saniyede bir yokluyor ve olculdugunde bos bir sistem dakikada 417 satir
    # basiyordu -- hicbiri gercek olay degil. Sorgu incelenecegi zaman acilir:
    #   SQL_LOG_LEVEL=debug SQL_FORMAT=true docker compose --profile full up -d
    org.hibernate.SQL: ${SQL_LOG_LEVEL:warn}
    com.proje.employee: debug

server:
  port: 8080
  # Zarif kapanma: SIGTERM gelince ucustaki istekler bitirilir, sonra kapanilir.
  # Varsayilan "immediate"da JVM aninda dagilir ve OutboxRelay parti ORTASINDA
  # olebilir -- broker'a gonderilmis ama published_at yazilmamis mesajlar
  # yeniden gider. At-least-once bunu emer, ama HER DAGITIMDA onlenebilir bir
  # mukerrer mail kaynagidir.
  shutdown: graceful

spring:
  # Sayfa boyutu TAVANI. Spring Data'nin varsayilani 2000: "?size=2000" ile
  # butun PII dizini tek cevapta cekilebiliyordu -- hem toplu sizdirma yolu
  # hem de her cagiran icin bellek sicramasi.
  data:
    web:
      pageable:
        max-page-size: 100

  # Zarif kapanmanin sunucu tarafina ayrilan sure. Docker'in
  # stop_grace_period'undan KUCUK olmali, yoksa JVM isini bitiremeden
  # SIGKILL yer ve zarif kapanma kagit uzerinde kalir.
  lifecycle:
    timeout-per-shutdown-phase: 20s

  # Iki @Scheduled is var (OutboxRelay ve RefreshTokenCleanup) ve Spring'in
  # varsayilan zamanlayici havuzu TEK ipliktir. Relay en kotu durumda
  # batch-size x confirm-timeout kadar (20 x 5sn = 100sn) o ipligi tutar ve
  # o sure boyunca jeton temizligi hic calisamaz.
  task:
    scheduling:
      pool:
        size: 2

  application:
    name: employee-service

  datasource:
    # Adres bilgilerinin varsayilani olabilir: yanlissa baglanti reddedilir, yani
    # gurultulu basarisiz olur. Kimlik bilgilerinin varsayilani YOKTUR -- varsayilan
    # sessiz bir geri dusustur ve yanlis kimlikle calismaya devam edilmesine yol acar.
    url: ${DB_URL:jdbc:postgresql://localhost:5432/employee_db}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

    hikari:
      # Timeout yazilmazsa varsayilan 30 sn'dir; veritabani erisilemezken saglik
      # ucu DOWN donmek yerine 30 sn askida kalir.
      connection-timeout: 3000
      validation-timeout: 2000

  jpa:
    hibernate:
      # Hibernate semayi yalnizca dogrular; sema degisiklikleri Flyway ile yapilir.
      ddl-auto: validate

    # Veritabani oturumunun controller katmanina uzamasini engeller.
    open-in-view: false

    properties:
      hibernate:
        # Uretimde KAPALI: her SQL zaten satirlarca yer kaplarken bir de
        # cok satira yayilirsa log hacmi katlanir. dev profili acar.
        format_sql: ${SQL_FORMAT:false}

  flyway:
    enabled: true

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME}
    password: ${RABBITMQ_PASSWORD}
    # correlated: her mesajin onayi kendi CorrelationData'sina duser, boylece
    # hangi mesajin kabul edildigi tek tek bilinir. Onaysiz gonderimde
    # "sokete yazildi" ile "broker aldi" ayirt edilemez.
    publisher-confirm-type: correlated

# API semasi VARSAYILAN OLARAK KAPALI.
#
# /v3/api-docs/** SecurityConfig'te permitAll: acik varsayilan, kimlik
# dogrulamasi olmayan birine butun uclari, DTO alanlarini ve dogrulama
# kurallarini okuturdu. Gelistirmede dev profili aciyor.
springdoc:
  api-docs:
    enabled: ${SWAGGER_ENABLED:false}
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:false}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true

# Ilk yonetici hesabi. Varsayilan YOK: tanimli degilse hesap olusturulmaz.
# Parola koda veya migration'a yazilmaz.
app:
  admin:
    email: ${ADMIN_EMAIL:}
    password: ${ADMIN_PASSWORD:}

  # Salt okuyan insan hesabi. Rol ayrimini denemek icin; zorunlu degil.
  user:
    email: ${USER_EMAIL:}
    password: ${USER_PASSWORD:}

  # Notification Service'in kullandigi okuma yetkili servis hesabi.
  service-account:
    email: ${SERVICE_ACCOUNT_EMAIL:}
    password: ${SERVICE_ACCOUNT_PASSWORD:}

  # Gelistirme ve tanitim verisi. Uretimde ASLA acilmaz; bu yuzden migration
  # degil, acikca acilan bir tohumlayici.
  demo-data:
    enabled: ${DEMO_DATA:false}

  cors:
    # Sir degil ama ortama gore degisir: uretimde gercek alan adi verilir.
    # Virgulle ayrilmis liste olarak okunur.
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}

  jwt:
    # Varsayilan YOK: tanimsizsa uygulama acilmaz. Bu anahtari bilen kendine
    # istedigi rolde token uretebilir, dolayisiyla depoya asla girmez.
    secret: ${JWT_SECRET}
    validity-minutes: ${JWT_VALIDITY_MINUTES:15}
    # Yenileme jetonu uzun omurludur ama IPTAL EDILEBILIR: veritabaninda
    # durdugu icin calindiginda oturum kapatilabilir. Erisim jetonunda bu
    # imkan yoktur, kisa omurlu olmasinin sebebi de budur.
    refresh-validity-days: ${JWT_REFRESH_VALIDITY_DAYS:7}

  login:
    # Bes deneme yaygin bir esik: kullaniciyi parolasini hatirlamaya calisirken
    # kilitlemeyecek kadar yuksek, kaba kuvveti anlamsiz kilacak kadar dusuk.
    max-attempts: ${LOGIN_MAX_ATTEMPTS:5}
    # Pencere hem SAYIM hem BLOKE suresidir: son basarisiz denemeden bu kadar
    # sure sonra sayac sifirlanir.
    block-duration-seconds: ${LOGIN_BLOCK_DURATION_SECONDS:300}

  outbox:
    # Yayin gecikmesinin ust siniri: olay en gec bu sure sonra gonderilir.
    poll-interval-ms: ${OUTBOX_POLL_INTERVAL_MS:2000}
    # Tek turda kilitlenecek satir sayisi. Relay, satir kilitlerini ve
    # veritabani baglantisini parti boyunca ACIK TUTAR (her mesaj icin broker
    # onayi beklenir), bu yuzden parti kucuk tutulur: kilit suresi sinirli kalir.
    batch-size: ${OUTBOX_BATCH_SIZE:20}
    # Broker'in reddettigi mesaj icin ust sinir. Erisilemezlik bu sayaci
    # artirmaz; yalnizca mesajin kendi kusuru sayilir.
    max-attempts: ${OUTBOX_MAX_ATTEMPTS:5}
    # Ag sinirini gecen her islem gibi onay beklemenin de suresi vardir.
    confirm-timeout-ms: ${OUTBOX_CONFIRM_TIMEOUT_MS:5000}
    # Yayinlanmis satirlar bu sureden sonra silinir. Saklamanin sebebi hata
    # ayiklama: "bu olay gercekten gonderilmis miydi" sorusu birkac gun
    # sorulabilir, aylar sonra sorulmaz.
    retention-days: ${OUTBOX_RETENTION_DAYS:30}
    cleanup-interval-ms: ${OUTBOX_CLEANUP_INTERVAL_MS:3600000}

management:
  endpoints:
    web:
      exposure:
        # Yalnizca gerekenler acilir. "*" yazmak /actuator/env ve /actuator/heapdump
        # gibi ortam degiskenlerini ve bellek dokumunu disariya acardi.
        include: health,info
  # /actuator/info'nun ICINI dolduran kaynaklar. build-info hedefi olmadan
  # uc aciktir ama bos doner -- "hangi surum calisiyor" sorusu cevapsiz kalir.
  info:
    build:
      enabled: true
    java:
      enabled: true
  endpoint:
    health:
      # Bilesen detaylari (veritabani surumu, disk) yalnizca yetkili istemciye.
      show-details: when-authorized
      probes:
        # liveness ve readiness uclarini ayri ayri acar.
        enabled: true

logging:
  # %X{...} MDC'den okur. Istek disinda uretilen loglarda (acilis gibi) bos kalir.
  pattern:
    level: "%5p [%X{correlationId:-________}]"
  level:
    # Varsayilan SESSIZ. Gurultu opt-in'dir: dev profili bunlari debug'a ceker.
    org.hibernate.SQL: ${SQL_LOG_LEVEL:warn}
    com.proje.employee: ${APP_LOG_LEVEL:info}

server:
  port: 8080

spring:
  application:
    name: employee-service

  datasource:
    # ${DEGISKEN:varsayilan}: once ortam degiskenine bakar, yoksa varsayilani kullanir.
    # Varsayilanlar yalnizca yerel gelistirme icindir; gercek ortamda disaridan verilir.
    url: ${DB_URL:jdbc:postgresql://localhost:5432/employee_db}
    username: ${DB_USERNAME:employee}
    password: ${DB_PASSWORD:employee123}

  jpa:
    hibernate:
      # Hibernate semayi yalnizca dogrular; sema degisiklikleri Flyway ile yapilir.
      ddl-auto: validate

    # Veritabani oturumunun controller katmanina uzamasini engeller.
    open-in-view: false

    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true

logging:
  level:
    org.hibernate.SQL: debug
    com.proje.employee: debug

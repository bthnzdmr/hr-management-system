server:
  port: 8080

spring:
  application:
    name: employee-service

  datasource:
    # ${DEGISKEN:varsayilan}: once ortam degiskenine bakar, yoksa varsayilani kullanir.
    # Varsayilanlar yalnizca yerel gelistirme icindir; gercek ortamda disaridan verilir.
    url: ${DB_URL:jdbc:postgresql://localhost:5432/employee_db}
    username: ${DB_USERNAME:employee}
    password: ${DB_PASSWORD:employee123}

    hikari:
      # Timeout yazilmazsa varsayilan 30 sn'dir; veritabani erisilemezken saglik
      # ucu DOWN donmek yerine 30 sn askida kalir.
      connection-timeout: 3000
      validation-timeout: 2000

  jpa:
    hibernate:
      # Hibernate semayi yalnizca dogrular; sema degisiklikleri Flyway ile yapilir.
      ddl-auto: validate

    # Veritabani oturumunun controller katmanina uzamasini engeller.
    open-in-view: false

    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true

# Ilk yonetici hesabi. Varsayilan YOK: tanimli degilse hesap olusturulmaz.
# Parola koda veya migration'a yazilmaz.
app:
  admin:
    email: ${ADMIN_EMAIL:}
    password: ${ADMIN_PASSWORD:}

  jwt:
    # Varsayilan YOK: tanimsizsa uygulama acilmaz. Bu anahtari bilen kendine
    # istedigi rolde token uretebilir, dolayisiyla depoya asla girmez.
    secret: ${JWT_SECRET}
    validity-minutes: ${JWT_VALIDITY_MINUTES:15}

management:
  endpoints:
    web:
      exposure:
        # Yalnizca gerekenler acilir. "*" yazmak /actuator/env ve /actuator/heapdump
        # gibi ortam degiskenlerini ve bellek dokumunu disariya acardi.
        include: health,info
  endpoint:
    health:
      # Bilesen detaylari (veritabani surumu, disk) yalnizca yetkili istemciye.
      show-details: when-authorized
      probes:
        # liveness ve readiness uclarini ayri ayri acar.
        enabled: true

logging:
  # %X{...} MDC'den okur. Istek disinda uretilen loglarda (acilis gibi) bos kalir.
  pattern:
    level: "%5p [%X{correlationId:-________}]"
  level:
    org.hibernate.SQL: debug
    com.proje.employee: debug

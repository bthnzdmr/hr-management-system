server:
  port: 8080

spring:
  application:
    name: employee-service

  datasource:
    # Adres bilgilerinin varsayilani olabilir: yanlissa baglanti reddedilir, yani
    # gurultulu basarisiz olur. Kimlik bilgilerinin varsayilani YOKTUR -- varsayilan
    # sessiz bir geri dusustur ve yanlis kimlikle calismaya devam edilmesine yol acar.
    url: ${DB_URL:jdbc:postgresql://localhost:5432/employee_db}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

    hikari:
      # Timeout yazilmazsa varsayilan 30 sn'dir; veritabani erisilemezken saglik
      # ucu DOWN donmek yerine 30 sn askida kalir.
      connection-timeout: 3000
      validation-timeout: 2000

  jpa:
    hibernate:
      # Hibernate semayi yalnizca dogrular; sema degisiklikleri Flyway ile yapilir.
      ddl-auto: validate

    # Veritabani oturumunun controller katmanina uzamasini engeller.
    open-in-view: false

    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME}
    password: ${RABBITMQ_PASSWORD}
    # correlated: her mesajin onayi kendi CorrelationData'sina duser, boylece
    # hangi mesajin kabul edildigi tek tek bilinir. Onaysiz gonderimde
    # "sokete yazildi" ile "broker aldi" ayirt edilemez.
    publisher-confirm-type: correlated

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true

# Ilk yonetici hesabi. Varsayilan YOK: tanimli degilse hesap olusturulmaz.
# Parola koda veya migration'a yazilmaz.
app:
  admin:
    email: ${ADMIN_EMAIL:}
    password: ${ADMIN_PASSWORD:}

  jwt:
    # Varsayilan YOK: tanimsizsa uygulama acilmaz. Bu anahtari bilen kendine
    # istedigi rolde token uretebilir, dolayisiyla depoya asla girmez.
    secret: ${JWT_SECRET}
    validity-minutes: ${JWT_VALIDITY_MINUTES:15}

  outbox:
    # Yayin gecikmesinin ust siniri: olay en gec bu sure sonra gonderilir.
    poll-interval-ms: ${OUTBOX_POLL_INTERVAL_MS:2000}
    # Tek turda kilitlenecek satir sayisi; kilit suresini sinirli tutar.
    batch-size: ${OUTBOX_BATCH_SIZE:100}
    # Broker'in reddettigi mesaj icin ust sinir. Erisilemezlik bu sayaci
    # artirmaz; yalnizca mesajin kendi kusuru sayilir.
    max-attempts: ${OUTBOX_MAX_ATTEMPTS:5}
    # Ag sinirini gecen her islem gibi onay beklemenin de suresi vardir.
    confirm-timeout-ms: ${OUTBOX_CONFIRM_TIMEOUT_MS:5000}

management:
  endpoints:
    web:
      exposure:
        # Yalnizca gerekenler acilir. "*" yazmak /actuator/env ve /actuator/heapdump
        # gibi ortam degiskenlerini ve bellek dokumunu disariya acardi.
        include: health,info
  endpoint:
    health:
      # Bilesen detaylari (veritabani surumu, disk) yalnizca yetkili istemciye.
      show-details: when-authorized
      probes:
        # liveness ve readiness uclarini ayri ayri acar.
        enabled: true

logging:
  # %X{...} MDC'den okur. Istek disinda uretilen loglarda (acilis gibi) bos kalir.
  pattern:
    level: "%5p [%X{correlationId:-________}]"
  level:
    org.hibernate.SQL: debug
    com.proje.employee: debug

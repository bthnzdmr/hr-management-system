spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/employee_db}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        # Sorgu sayaci: testte kac SQL cumlesi calistigini olcebilmek icin.
        generate_statistics: true

  flyway:
    enabled: true

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME}
    password: ${RABBITMQ_PASSWORD}
    publisher-confirm-type: correlated

eureka:
  client:
    enabled: false

# Test icin sabit anahtar: gercek sir degil, yalnizca JwtService'in
# ayaga kalkabilmesi icin gereken 32+ baytlik bir deger.
app:
  login:
    # Bes deneme yaygin bir esik: kullaniciyi parolasini hatirlamaya calisirken
    # kilitlemeyecek kadar yuksek, kaba kuvveti anlamsiz kilacak kadar dusuk.
    max-attempts: ${LOGIN_MAX_ATTEMPTS:5}
    # Pencere hem SAYIM hem BLOKE suresidir: son basarisiz denemeden bu kadar
    # sure sonra sayac sifirlanir.
    block-duration-seconds: ${LOGIN_BLOCK_DURATION_SECONDS:300}

  jwt:
    secret: dGVzdC1vbmx5LWtleS1ub3QtYS1yZWFsLXNlY3JldC0zMisNCg==
    validity-minutes: 15
  cors:
    allowed-origins: http://localhost:5173

  # Bu dosya ana application.yml'i TAMAMEN golgeler (test classpath'i once
  # gelir). Kodun okudugu her anahtar burada da bulunmak zorundadir; aksi
  # halde ilk @SpringBootTest "Could not resolve placeholder" ile patlar.
  outbox:
    poll-interval-ms: 2000
    batch-size: 20
    max-attempts: 5
    confirm-timeout-ms: 5000
    # Yayinlanmis satirlar bu sureden sonra silinir. Saklamanin sebebi hata
    # ayiklama: "bu olay gercekten gonderilmis miydi" sorusu birkac gun
    # sorulabilir, aylar sonra sorulmaz.
    retention-days: ${OUTBOX_RETENTION_DAYS:30}
    cleanup-interval-ms: ${OUTBOX_CLEANUP_INTERVAL_MS:3600000}

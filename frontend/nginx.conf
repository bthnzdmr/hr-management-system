# nginx surumunu cevaplarda ve hata sayfalarinda gizler: saldirgana hangi
# surumun acikli oldugunu soylemenin bir faydasi yok.
server_tokens off;

gzip on;
gzip_types text/css application/javascript application/json image/svg+xml;
gzip_min_length 1024;

server {
    # nginx-unprivileged root olmadan calisir ve 1024 altindaki portlari
    # dinleyemez; disariya 5173 olarak yayinlanir.
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # always: hata sayfalarinda da gonderilsin.
    # nosniff       -> tarayici Content-Type'i tahmin etmeye calismasin
    # frame-ancestors -> clickjacking; uygulama JWT tasidigi icin dogrudan ilgili
    # Referrer-Policy -> adres satirindaki bilgi disariya sizmasin
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # __API_ORIGIN__ build sirasinda VITE_API_URL ile degistirilir. Sabit
    # yazilsaydi API adresini degistiren kisinin uygulamasi CSP'ye takilir ve
    # sebebi belirsiz bir sekilde kirilirdi; iki deger tek kaynaktan gelir.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' __API_ORIGIN__; frame-ancestors 'none'" always;

    location / {
        # Tek sayfa uygulamasinda yonlendirme React Router'in isidir.
        # Bu satir olmadan kullanici /employees sayfasinda F5'e bastiginda
        # nginx o yolda dosya arar ve 404 doner.
        try_files $uri $uri/ /index.html;
    }

    # DIKKAT: nginx'te add_header MIRAS ALINMAZ. Bir location kendi
    # add_header'ini tanimlarsa ust bloktaki TUM basliklar iptal olur.
    # Bu yuzden guvenlik basliklari her location'da tekrar yazilir.
    location = /index.html {
        # Giris belgesi ASLA onbelleklenmez. Onbelleklenirse, yeni dagitimdan
        # sonra donen kullanici artik var olmayan varlik dosyalarina atifta
        # bulunan eski bir index.html alir ve bos ekran gorur.
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' __API_ORIGIN__; frame-ancestors 'none'" always;
    }

    location /assets/ {
        # Uretilen varliklarin adinda icerik ozeti vardir; degisen dosya yeni
        # ad alir, bu yuzden sonsuza kadar onbelleklenebilir.
        # Tek baslik olarak yazilir: "expires" ayri bir Cache-Control uretir
        # ve iki cakisan baslik olusurdu.
        add_header Cache-Control "public, immutable, max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }
}

server {
    # nginx-unprivileged root olmadan calisir ve 1024 altindaki portlari
    # dinleyemez; disariya 5173 olarak yayinlanir.
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        # Tek sayfa uygulamasinda yonlendirme React Router'in isidir.
        # Bu satir olmadan kullanici /employees sayfasinda F5'e bastiginda
        # nginx o yolda dosya arar ve 404 doner.
        try_files $uri $uri/ /index.html;
    }

    # Uretilen varliklarin adinda icerik ozeti vardir; degisen dosya yeni ad alir.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="HR">
  <!--
    Uygulama icindeki marka isaretinin aynisi: kil zemin, koyu "HR".
    Ayni kimlik iki yerde ayni gorunmeli, yoksa sekme ile ekran iki farkli
    urunmus gibi durur.

    Harfler YAZI TIPIYLE degil, sekil olarak cizildi. <text> kullanilsaydi
    render, kullanicinin makinesinde hangi yazi tipinin bulunduguna bagli
    olurdu; favicon'da yedek yazi tipi sessizce devreye girer ve isaret
    her tarayicida baska gorunur.

    Olculer favicon boyutuna gore secildi: harfler kutunun genisliginin
    ucte ikisini kaplar ve R'nin GOZU 8x7 birimdir. Ilk denemede goz 3x4
    birimdi ve 16 piksele kuculdugunde kapanip harfi lekeye ceviriyordu.
  -->
  <rect width="64" height="64" rx="14" fill="#C68465"/>

  <g fill="#141A22">
    <!-- H: iki dikey govde ve ortada kirisc -->
    <rect x="10" y="17" width="6" height="30"/>
    <rect x="24" y="17" width="6" height="30"/>
    <rect x="10" y="29" width="20" height="6"/>

    <!-- R: govde, kapali kase ve bacak -->
    <rect x="34" y="17" width="6" height="30"/>
    <rect x="34" y="17" width="20" height="6"/>
    <rect x="48" y="17" width="6" height="19"/>
    <rect x="34" y="30" width="20" height="6"/>
    <polygon points="40,36 46,36 54,47 48,47"/>
  </g>
</svg>

server:
  port: 8081

spring:
  application:
    name: notification-service

  datasource:
    # Employee Service'inkinden AYRI veritabani: bu servis oradaki tablolari
    # gormez. Ayni sunucu olmasi gelistirme kolayligi icindir.
    url: ${NOTIFICATION_DB_URL:jdbc:postgresql://localhost:5432/notification_db}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

    hikari:
      connection-timeout: 3000
      validation-timeout: 2000

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME}
    password: ${RABBITMQ_PASSWORD}

    listener:
      simple:
        # Basarisiz mesaj once bellek ici olarak yeniden denenir; hak bitince
        # requeue edilmeden reddedilir ve kuyrugun DLX'i uzerinden DLQ'ya duser.
        # Retry kapali olsaydi mesaj sonsuza kadar kuyruga geri konurdu.
        retry:
          enabled: true
          max-attempts: 3
          initial-interval: 1s
          multiplier: 2
          max-interval: 10s
        default-requeue-rejected: false

  mail:
    # MailHog kimlik dogrulamaz ve TLS istemez; gercek bir SMTP sunucusunda
    # bu iki ayar da degisir ve kimlik bilgisi ortam degiskeninden gelir.
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    properties:
      mail:
        smtp:
          auth: false
          starttls:
            enable: false
          # Ag sinirini gecen her islem gibi mail gonderiminin de suresi vardir.
          connectiontimeout: 3000
          timeout: 5000
          writetimeout: 5000

  cloud:
    openfeign:
      client:
        config:
          default:
            # Ag sinirini gecen her cagrinin suresi vardir. Timeout olmasaydi
            # Employee Service yanit vermediginde tuketici is parcacigi
            # sureli belirsiz bloke olur ve kuyruk birikirdi.
            connect-timeout: 2000
            read-timeout: 3000

app:
  mail:
    # Sir degil, gorunur bir gonderici adresi; varsayilani olmasi sakincasiz.
    from: ${MAIL_FROM:hr-system@example.com}

  employee-service:
    # Servis hesabi: Employee Service'te ayni degerlerle olusturulur.
    # Varsayilan YOK -- kimlik bilgisi sessizce geri dusmez.
    username: ${SERVICE_ACCOUNT_EMAIL}
    password: ${SERVICE_ACCOUNT_PASSWORD}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true

logging:
  pattern:
    level: "%5p [%X{correlationId:-________}]"
  level:
    com.proje.notification: debug

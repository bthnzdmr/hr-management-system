server:
  port: 8081
  # Kapanirken islenmekte olan mesaj tamamlanir; yarida kesilirse RabbitMQ
  # onu yeniden teslim eder ve mukerrer mail gider.
  shutdown: graceful

spring:
  # Docker'in stop_grace_period'undan kucuk olmali.
  lifecycle:
    timeout-per-shutdown-phase: 20s

  application:
    name: notification-service

  datasource:
    # Employee Service'inkinden AYRI veritabani: bu servis oradaki tablolari
    # gormez. Ayni sunucu olmasi gelistirme kolayligi icindir.
    url: ${NOTIFICATION_DB_URL:jdbc:postgresql://localhost:5432/notification_db}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

    hikari:
      connection-timeout: 3000
      validation-timeout: 2000

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME}
    password: ${RABBITMQ_PASSWORD}

    listener:
      simple:
        # Basarisiz mesaj once bellek ici olarak yeniden denenir; hak bitince
        # RepublishMessageRecoverer mesaji DLQ'ya tasir.
        # Retry kapali olsaydi mesaj sonsuza kadar kuyruga geri konurdu.
        #
        # Onceki degerler 1 sn + 2 sn = ~3 saniyelik tolerans veriyordu; bundan
        # uzun suren HER SMTP veya veritabani kesintisi tum olaylari DLQ'ya
        # dokerdi. Simdi 2+4+8+16 = 30 saniye.
        retry:
          enabled: true
          max-attempts: 5
          initial-interval: 2s
          multiplier: 2
          max-interval: 30s
        default-requeue-rejected: false

  mail:
    # MailHog kimlik dogrulamaz ve TLS istemez; gercek bir SMTP sunucusunda
    # bu iki ayar da degisir ve kimlik bilgisi ortam degiskeninden gelir.
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    properties:
      mail:
        smtp:
          auth: false
          starttls:
            enable: false
          # Ag sinirini gecen her islem gibi mail gonderiminin de suresi vardir.
          connectiontimeout: 3000
          timeout: 5000
          writetimeout: 5000

  cloud:
    openfeign:
      client:
        config:
          default:
            # Ag sinirini gecen her cagrinin suresi vardir. Timeout olmasaydi
            # Employee Service yanit vermediginde tuketici is parcacigi
            # sureli belirsiz bloke olur ve kuyruk birikirdi.
            connect-timeout: 2000
            read-timeout: 3000

app:
  processed-event:
    # Saklama suresi, bir mesajin broker'da bekleyebilecegi en uzun sureden
    # GUVENLE uzun secilir: satir erken silinirse gec teslim edilen bir olay
    # "hic islenmemis" gorunur ve ikinci bir mail gider.
    retention-days: ${PROCESSED_EVENT_RETENTION_DAYS:30}
    cleanup-interval-ms: ${PROCESSED_EVENT_CLEANUP_INTERVAL_MS:3600000}

  mail:
    # Sir degil, gorunur bir gonderici adresi; varsayilani olmasi sakincasiz.
    from: ${MAIL_FROM:hr-system@example.com}

  employee-service:
    # Servis hesabi: Employee Service'te ayni degerlerle olusturulur.
    # Varsayilan YOK -- kimlik bilgisi sessizce geri dusmez.
    username: ${SERVICE_ACCOUNT_EMAIL}
    password: ${SERVICE_ACCOUNT_PASSWORD}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true

management:
  # Actuator API ILE AYNI PORTTA DEGIL.
  #
  # 8080 disari yayimlaniyor; metrikler ayni portta kalsaydi /actuator/prometheus
  # de disaridan okunabilirdi. Metrik masum gorunur ama uc desenlerini, istek
  # sayilarini ve hata oranlarini sizdirir -- kesif icin degerli bilgi.
  #
  # 9090 compose'da YAYIMLANMIYOR: yalnizca Docker aginin icinden, yani
  # Prometheus konteynerinden erisilebilir. Ayri bir yonetim portu Spring
  # Boot'ta ayri bir baglam acar; ana guvenlik zinciri oraya uygulanmaz ve
  # buna gerek de yoktur -- koruma AG SEVIYESINDEDIR.
  server:
    port: ${MANAGEMENT_PORT:9090}
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  # /actuator/info'nun ICINI dolduran kaynaklar. build-info hedefi olmadan
  # uc aciktir ama bos doner -- "hangi surum calisiyor" sorusu cevapsiz kalir.
  info:
    build:
      enabled: true
    java:
      enabled: true
  health:
    # SMTP kesintisi tuketiciyi HASTA yapmaz. Olculdu: MailHog durunca servis
    # "unhealthy" isaretleniyordu, oysa kuyrugu tuketmeye ve veritabanina
    # yazmaya devam ediyordu. Gercek bir orkestratorde bu, calisan bir
    # tuketiciyi oldururdu. Mail sunucusuna ulasilamamasi tuketicinin ISIDIR,
    # canliligi degil -- ve zaten DLQ ile gorunur olur.
    mail:
      enabled: false
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true

logging:
  pattern:
    level: "%5p [%X{correlationId:-________}]"
  level:
    # Varsayilan SESSIZ; dev profili debug'a ceker.
    com.proje.notification: ${APP_LOG_LEVEL:info}

# Gelistirme altyapisi: tek komutla ayaga kalkar -> "docker compose up -d"
# Uygulamalari degil, uygulamalarin ihtiyac duydugu servisleri calistirir.

services:

  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: hr-rabbitmq
    ports:
      - "5672:5672"     # AMQP
      - "15672:15672"   # web panel -> http://localhost:15672 (guest/guest)
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest

  postgres:
    image: postgres:16
    container_name: hr-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: employee_db
      POSTGRES_USER: employee
      POSTGRES_PASSWORD: employee123
    volumes:
      - postgres-data:/var/lib/postgresql/data

  mailhog:
    image: mailhog/mailhog:latest
    container_name: hr-mailhog
    ports:
      - "1025:1025"     # SMTP -> Notification Service buraya mail atar
      - "8025:8025"     # web arayuz -> http://localhost:8025

volumes:
  postgres-data:

# Iki calisma bicimi vardir:
#
#   docker compose up -d                  altyapi (gelistirme akisi)
#   docker compose --profile full up -d   altyapi + tum uygulamalar
#
# Gelistirirken ilki kullanilir: kod degistiginde imaj yeniden build edilmez,
# servisler makinede "mvn spring-boot:run" ile calisir.
#
# Kimlik bilgileri .env dosyasindan okunur (Docker Compose bunu kendiliginden yapar).
# .env depoda yoktur; .env.example dosyasini kopyalayarak olusturulur.

services:

  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: hr-rabbitmq
    ports:
      - "5672:5672"     # AMQP
      - "15672:15672"   # web panel -> http://localhost:15672
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USERNAME:?RABBITMQ_USERNAME tanimli degil, .env dosyasini olustur}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD tanimli degil, .env dosyasini olustur}
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 512M

  postgres:
    image: postgres:16
    container_name: hr-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-employee_db}
      POSTGRES_USER: ${DB_USERNAME:?DB_USERNAME tanimli degil, .env dosyasini olustur}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD tanimli degil, .env dosyasini olustur}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # Yalnizca ilk kurulumda calisir; her iki servisin veritabanini olusturur.
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # Uygulamalar veritabani hazir olmadan baslarsa Flyway baglanamaz ve
      # konteyner acilista oler. depends_on tek basina yetmez: konteynerin
      # BASLAMIS olmasi, icindeki veritabaninin HAZIR olmasi demek degildir.
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 512M

  mailhog:
    image: mailhog/mailhog:latest
    container_name: hr-mailhog
    ports:
      - "1025:1025"     # SMTP -> Notification Service buraya mail atar
      - "8025:8025"     # web arayuz -> http://localhost:8025
    deploy:
      resources:
        limits:
          memory: 128M

  # ---------- Uygulamalar (yalnizca "full" profilinde) ----------

  eureka-server:
    build: ./eureka-server
    image: hr/eureka-server:1.0.0
    container_name: hr-eureka
    profiles: ["full"]
    ports:
      - "8761:8761"
    healthcheck:
      # Eureka'da actuator yok; panelin cevap vermesi canlilik sinyali olarak
      # kullaniliyor. Gercek bir saglik ucu icin actuator eklenmelidir.
      test: ["CMD", "wget", "-qO-", "http://localhost:8761/"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 512M

  employee-service:
    build: ./employee-service
    image: hr/employee-service:1.0.0
    container_name: hr-employee-service
    profiles: ["full"]
    ports:
      - "8080:8080"
    environment:
      # Konteyner icinde "localhost" kendi konteyneridir; adresler servis
      # adlarina doner. Java kodunda tek satir degismez -- adresler zaten
      # ortam degiskeninden okunuyordu.
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-employee_db}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USERNAME: ${RABBITMQ_USERNAME}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
      EUREKA_URL: http://eureka-server:8761/eureka/
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET tanimli degil, .env dosyasini olustur}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      SERVICE_ACCOUNT_EMAIL: ${SERVICE_ACCOUNT_EMAIL:-}
      SERVICE_ACCOUNT_PASSWORD: ${SERVICE_ACCOUNT_PASSWORD:-}
      # Tarayici Docker aginin disindadir; frontend'in adresi host uzerinden gorunur.
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173}
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      eureka-server:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s
    deploy:
      resources:
        limits:
          memory: 768M

  notification-service:
    build: ./notification-service
    image: hr/notification-service:1.0.0
    container_name: hr-notification-service
    profiles: ["full"]
    ports:
      - "8081:8081"
    environment:
      NOTIFICATION_DB_URL: jdbc:postgresql://postgres:5432/notification_db
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USERNAME: ${RABBITMQ_USERNAME}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
      MAIL_HOST: mailhog
      EUREKA_URL: http://eureka-server:8761/eureka/
      SERVICE_ACCOUNT_EMAIL: ${SERVICE_ACCOUNT_EMAIL}
      SERVICE_ACCOUNT_PASSWORD: ${SERVICE_ACCOUNT_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      eureka-server:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8081/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s
    deploy:
      resources:
        limits:
          memory: 768M

  frontend:
    build:
      context: ./frontend
      args:
        # Build zamaninda koda gomulur. Istegi yapan taraf tarayici oldugu icin
        # deger "employee-service" degil "localhost" olmalidir.
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8080}
    image: hr/frontend:1.0.0
    container_name: hr-frontend
    profiles: ["full"]
    ports:
      - "5173:8080"
    depends_on:
      - employee-service
    deploy:
      resources:
        limits:
          memory: 128M

volumes:
  postgres-data:

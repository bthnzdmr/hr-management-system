# Iki calisma bicimi vardir:
#
#   docker compose up -d                  altyapi (gelistirme akisi)
#   docker compose --profile full up -d   altyapi + tum uygulamalar
#
# Gelistirirken ilki kullanilir: kod degistiginde imaj yeniden build edilmez,
# servisler makinede "mvn spring-boot:run" ile calisir.
#
# Kimlik bilgileri .env dosyasindan okunur (Docker Compose bunu kendiliginden yapar).
# .env depoda yoktur; .env.example dosyasini kopyalayarak olusturulur.

services:

  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: ${STACK_PREFIX:-hr}-rabbitmq
    # Makine yeniden baslarsa sistem de kalksin; elle durdurulduysa kalksin diye degil.
    restart: unless-stopped
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"     # AMQP
      - "${RABBITMQ_PANEL_PORT:-15672}:15672"   # web panel -> http://localhost:15672
      # 15692 YAYIMLANMAZ: metrik ucu ag icinde kalir, Prometheus oradan kazir.
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USERNAME:?see .env.example}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?see .env.example}
    volumes:
      # rabbitmq_prometheus imajda GELIR ama varsayilan olarak KAPALIDIR.
      # Acilmasaydi panodaki DLQ gostergesi bos kalirdi -- ve bos bir gosterge,
      # "sifir mesaj" ile "olcum yok" arasindaki farki gizler.
      - ./ops/rabbitmq/enabled_plugins:/etc/rabbitmq/enabled_plugins:ro
      - ./ops/rabbitmq/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          # Bellek siniri vardi ama CPU yoktu: tek bir servis makinenin tum
          # cekirdeklerini tuketebiliyordu.
          cpus: '1.0'
          memory: 512M

  postgres:
    image: postgres:16
    container_name: ${STACK_PREFIX:-hr}-postgres
    # Makine yeniden baslarsa sistem de kalksin; elle durdurulduysa kalksin diye degil.
    restart: unless-stopped
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-employee_db}
      POSTGRES_USER: ${DB_USERNAME:?see .env.example}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?see .env.example}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # Yalnizca ilk kurulumda calisir; her iki servisin veritabanini olusturur.
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # Uygulamalar veritabani hazir olmadan baslarsa Flyway baglanamaz ve
      # konteyner acilista oler. depends_on tek basina yetmez: konteynerin
      # BASLAMIS olmasi, icindeki veritabaninin HAZIR olmasi demek degildir.
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          # Bellek siniri vardi ama CPU yoktu: tek bir servis makinenin tum
          # cekirdeklerini tuketebiliyordu.
          cpus: '1.0'
          memory: 512M

  mailhog:
    image: mailhog/mailhog:v1.0.1
    container_name: ${STACK_PREFIX:-hr}-mailhog
    # Makine yeniden baslarsa sistem de kalksin; elle durdurulduysa kalksin diye degil.
    restart: unless-stopped
    ports:
      - "${MAILHOG_SMTP_PORT:-1025}:1025"     # SMTP -> Notification Service buraya mail atar
      - "${MAILHOG_PANEL_PORT:-8025}:8025"     # web arayuz -> http://localhost:8025
    deploy:
      resources:
        limits:
          # Bellek siniri vardi ama CPU yoktu: tek bir servis makinenin tum
          # cekirdeklerini tuketebiliyordu.
          cpus: '1.0'
          memory: 128M

  # ---------- Uygulamalar (yalnizca "full" profilinde) ----------

  eureka-server:
    build: ./eureka-server
    image: hr/eureka-server:1.0.0
    container_name: ${STACK_PREFIX:-hr}-eureka
    # Makine yeniden baslarsa sistem de kalksin; elle durdurulduysa kalksin diye degil.
    restart: unless-stopped
    profiles: ["full"]
    environment:
      # Compose'un "full" profili YEREL GELISTIRME yigindir; uretim degil.
      # dev profili self-preservation'i kapatir: servis durdurulunca rehberden
      # hemen dussun. Gercek bir dagitimda degisken bos birakilir ve
      # self-preservation ACIK kalir.
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
    ports:
      - "${EUREKA_PORT:-8761}:8761"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8761/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    deploy:
      resources:
        limits:
          # Bellek siniri vardi ama CPU yoktu: tek bir servis makinenin tum
          # cekirdeklerini tuketebiliyordu.
          cpus: '1.0'
          memory: 512M

  employee-service:
    build: ./employee-service
    image: hr/employee-service:1.0.0
    container_name: ${STACK_PREFIX:-hr}-employee-service
    # Zarif kapanma icin sure taniyin: Docker'in varsayilani 10 sn ve
    # uygulama 20 sn'lik bir kapanma butcesi istiyor. Kisa kalsaydi JVM
    # isini bitiremeden SIGKILL yer ve zarif kapanma kagit uzerinde kalirdi.
    stop_grace_period: 30s
    # Makine yeniden baslarsa sistem de kalksin; elle durdurulduysa kalksin diye degil.
    restart: unless-stopped
    profiles: ["full"]
    ports:
      - "${EMPLOYEE_PORT:-8080}:8080"
    environment:
      # Compose'un "full" profili YEREL GELISTIRME yigindir; uretim degil.
      # Bu yuzden dev profili varsayilan olarak aciktir: DEBUG SQL ve Swagger
      # burada isteniyor. Gercek bir dagitimda degisken bos birakilir ve
      # uygulama ana yml'deki uretim-guvenli varsayilanlarla acilir.
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      # Konteyner icinde "localhost" kendi konteyneridir; adresler servis
      # adlarina doner. Java kodunda tek satir degismez -- adresler zaten
      # ortam degiskeninden okunuyordu.
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-employee_db}
      DB_USERNAME: ${DB_USERNAME:?see .env.example}
      DB_PASSWORD: ${DB_PASSWORD:?see .env.example}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USERNAME: ${RABBITMQ_USERNAME:?see .env.example}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:?see .env.example}
      EUREKA_URL: http://eureka-server:8761/eureka/
      JWT_SECRET: ${JWT_SECRET:?see .env.example}
      # Yonetici hesabi GERCEKTEN opsiyoneldir: verilmezse hesap olusturulmaz.
      # Korumasiz kalmasi bilincli, digerlerinden farkli.
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      # Salt okuyan insan hesabi; ayni sekilde opsiyonel.
      USER_EMAIL: ${USER_EMAIL:-}
      USER_PASSWORD: ${USER_PASSWORD:-}
      # Rol basina demo hesaplari. Hepsi opsiyonel; verilmezse acilmazlar.
      # Uygulama ortam degiskenini KENDILIGINDEN gormez -- compose'un onu
      # acikca gecirmesi gerekir. Bu satirlar olmadan .env'e yazmak hicbir
      # sey yapmaz ve hesaplar sessizce olusmaz.
      DEMO_MANAGER_EMAIL: ${DEMO_MANAGER_EMAIL:-}
      DEMO_MANAGER_PASSWORD: ${DEMO_MANAGER_PASSWORD:-}
      DEMO_HR_EMAIL: ${DEMO_HR_EMAIL:-}
      DEMO_HR_PASSWORD: ${DEMO_HR_PASSWORD:-}
      DEMO_SYSADMIN_EMAIL: ${DEMO_SYSADMIN_EMAIL:-}
      DEMO_SYSADMIN_PASSWORD: ${DEMO_SYSADMIN_PASSWORD:-}
      DEMO_PAYROLL_EMAIL: ${DEMO_PAYROLL_EMAIL:-}
      DEMO_PAYROLL_PASSWORD: ${DEMO_PAYROLL_PASSWORD:-}
      # Gelistirme/tanitim verisi. Varsayilan kapali.
      DEMO_DATA: ${DEMO_DATA:-false}
      # full profilinde Notification Service de calisiyor ve bu hesapla giris
      # yapiyor; hesap olusturulmazsa yonetici CC'si hicbir zaman calismaz.
      SERVICE_ACCOUNT_EMAIL: ${SERVICE_ACCOUNT_EMAIL:?see .env.example}
      SERVICE_ACCOUNT_PASSWORD: ${SERVICE_ACCOUNT_PASSWORD:?see .env.example}
      # Tarayici Docker aginin disindadir; frontend'in adresi host uzerinden gorunur.
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173}
      # Bu profil bir gosterim yiginidir, uretim degil: Swagger acik kalir.
      # Gercek bir dagitimda false verilir; anahtar burada gorunur olsun diye
      # acikca yazildi.
      SWAGGER_ENABLED: ${SWAGGER_ENABLED:-true}
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:9090/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s
    deploy:
      resources:
        limits:
          # Bellek siniri vardi ama CPU yoktu: tek bir servis makinenin tum
          # cekirdeklerini tuketebiliyordu.
          cpus: '1.0'
          memory: 768M

  notification-service:
    build: ./notification-service
    image: hr/notification-service:1.0.0
    container_name: ${STACK_PREFIX:-hr}-notification-service
    # Zarif kapanma icin sure taniyin: Docker'in varsayilani 10 sn ve
    # uygulama 20 sn'lik bir kapanma butcesi istiyor. Kisa kalsaydi JVM
    # isini bitiremeden SIGKILL yer ve zarif kapanma kagit uzerinde kalirdi.
    stop_grace_period: 30s
    # Makine yeniden baslarsa sistem de kalksin; elle durdurulduysa kalksin diye degil.
    restart: unless-stopped
    profiles: ["full"]
    ports:
      - "${NOTIFICATION_PORT:-8081}:8081"
    environment:
      # Compose'un "full" profili YEREL GELISTIRME yigindir; uretim degil.
      # Bu yuzden dev profili varsayilan olarak aciktir: DEBUG SQL ve Swagger
      # burada isteniyor. Gercek bir dagitimda degisken bos birakilir ve
      # uygulama ana yml'deki uretim-guvenli varsayilanlarla acilir.
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      NOTIFICATION_DB_URL: jdbc:postgresql://postgres:5432/notification_db
      DB_USERNAME: ${DB_USERNAME:?see .env.example}
      DB_PASSWORD: ${DB_PASSWORD:?see .env.example}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USERNAME: ${RABBITMQ_USERNAME:?see .env.example}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:?see .env.example}
      MAIL_HOST: mailhog
      EUREKA_URL: http://eureka-server:8761/eureka/
      # :? korumasi sart. Olmasaydi Compose bos dizge enjekte eder, servis
      # SAGLIKLI acilir ve her olay Feign girisinde patlayip DLQ'ya duserdi --
      # sessiz geri dusus, tam da kacinmak istedigimiz sey.
      SERVICE_ACCOUNT_EMAIL: ${SERVICE_ACCOUNT_EMAIL:?see .env.example}
      SERVICE_ACCOUNT_PASSWORD: ${SERVICE_ACCOUNT_PASSWORD:?see .env.example}
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:9090/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s
    deploy:
      resources:
        limits:
          # Bellek siniri vardi ama CPU yoktu: tek bir servis makinenin tum
          # cekirdeklerini tuketebiliyordu.
          cpus: '1.0'
          memory: 768M

  frontend:
    build:
      context: ./frontend
      args:
        # Build zamaninda koda gomulur. Istegi yapan taraf tarayici oldugu icin
        # deger "employee-service" degil "localhost" olmalidir.
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8080}
    image: hr/frontend:1.0.0
    container_name: ${STACK_PREFIX:-hr}-frontend
    # Makine yeniden baslarsa sistem de kalksin; elle durdurulduysa kalksin diye degil.
    restart: unless-stopped
    profiles: ["full"]
    ports:
      - "5173:8080"
    depends_on:
      - employee-service
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          # Bellek siniri vardi ama CPU yoktu: tek bir servis makinenin tum
          # cekirdeklerini tuketebiliyordu.
          cpus: '1.0'
          memory: 128M

  # ---------------------------------------------------------------------
  # Metrik yigini. AYRI BIR PROFIL: gunluk gelistirme dongusune iki
  # konteyner daha yuklememek icin opt-in.
  #
  #   docker compose --profile full --profile metrics up -d
  # ---------------------------------------------------------------------
  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: ${STACK_PREFIX:-hr}-prometheus
    restart: unless-stopped
    profiles: ["metrics"]
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      # Saklama suresi: metrik bir GECMIS kaydi degil, bir egilim gostergesi.
      - "--storage.tsdb.retention.time=15d"
    volumes:
      - ./ops/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "9091:9090"   # host:9091 -> panel; 9090 servislerin yonetim portu
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M

  grafana:
    image: grafana/grafana:11.1.0
    container_name: ${STACK_PREFIX:-hr}-grafana
    restart: unless-stopped
    profiles: ["metrics"]
    environment:
      # Gelistirme yigini: anonim erisim acik ve giris ekrani yok. Gercek bir
      # dagitimda BU SATIRLAR KALKAR -- panel de bir uygulamadir ve kimlik
      # dogrulamasi ister.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_USERS_DEFAULT_THEME: dark
    volumes:
      - ./ops/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./ops/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M

volumes:
  prometheus-data:
  grafana-data:
  postgres-data:

# Personel Service ayarlari

server:
  port: 8080        # Spring Boot'un varsayilani da 8080'dir; acikca yaziyoruz ki gorunur olsun.

spring:
  application:
    name: personel-service   # Eureka'ya bu isimle kaydolur; Feign de bu ismi kullanacak.

  datasource:
    # ${DEGISKEN:varsayilan} sozdizimi: once ortam degiskenine bakar, yoksa varsayilani kullanir.
    # Varsayilanlar SADECE yerel gelistirme icindir (docker-compose'daki tek kullanimlik deger).
    # Gercek ortamda bu degerler ortam degiskeniyle disaridan verilir, dosyaya yazilmaz.
    url: ${DB_URL:jdbc:postgresql://localhost:5432/personel_db}
    username: ${DB_USERNAME:personel}
    password: ${DB_PASSWORD:personel123}

  jpa:
    hibernate:
      # validate: Hibernate semayi SADECE dogrular, degistirmez.
      # update/create kullanilmaz -- sema degisiklikleri yalnizca Flyway ile yapilir.
      ddl-auto: validate

    # false olmali: acik kalirsa veritabani oturumu controller katmanina kadar uzar
    # ve transaction sinirini service katmaninda tutma kuralini bozar.
    open-in-view: false

    properties:
      hibernate:
        format_sql: true

  flyway:
    # Faz 1.3'te ilk migration (V1__create_personel.sql) yazilinca true yapilacak.
    # Su an calistirilacak migration olmadigi icin kapali.
    enabled: false

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
  instance:
    # Kayit sirasinda makine adi yerine IP kullanilir; yerel ortamda daha guvenilir cozumlenir.
    prefer-ip-address: true

logging:
  level:
    # Hibernate'in urettigi SQL'i gormek ogrenme asamasinda faydali.
    org.hibernate.SQL: debug

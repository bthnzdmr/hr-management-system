# Surekli entegrasyon.
#
# Yazilmis ama kosturulmayan test, yazilmamis testtir -- ustelik guvenlik
# yanilsamasi da yaratir. Bu dosyanin cozdugu problem hiz degil, disiplinin
# INSANA BAGIMLI OLMAMASI: "her degisiklikten sonra testleri kos" bir kural
# olarak unutulur, bir pipeline olarak unutulamaz.
#
# Docker imaji testleri bilerek atliyor (-DskipTests) cunku testler gercek
# PostgreSQL ve RabbitMQ istiyor. Yani imaj derlemesi bir guvenlik agi degil;
# commit ile calisan imaj arasindaki tek otomatik kapi burasi.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  # Guvenlik taramasi icin: bir bagimliligin acigi kodla degil ZAMANLA cikar.
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

# Ayni dal icin yeni bir itme gelirse suren kosuyu iptal et: eskimis bir
# sonucu beklemek kimseye fayda saglamaz.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (${{ matrix.service }})
    runs-on: ubuntu-latest
    strategy:
      # Bir servis kirilirsa digerinin sonucunu da gormek isteriz.
      fail-fast: false
      matrix:
        service: [employee-service, notification-service]

    env:
      # CI'ya ozel, uretimle ilgisiz kimlik bilgileri. Testler bunlari
      # dogrudan okur (test/resources/application.yml varsayilansiz istiyor).
      #
      # JWT_SECRET base64 OLMAK ZORUNDA: uygulama sirri cozerek okuyor ve
      # gecersiz bir deger uygulamayi hic actirmiyor. Onceki deger '-'
      # iceriyordu; testler kendi sirrini kullandigi icin fark edilmemisti.
      DB_USERNAME: ci
      DB_PASSWORD: ci
      RABBITMQ_USERNAME: ci
      RABBITMQ_PASSWORD: ci
      JWT_SECRET: Y2ktb25seS1rZXktbm90LWEtcmVhbC1zZWNyZXQtNDgtYnl0ZXMtcGFkZGluZyEh
      ADMIN_EMAIL: admin@example.com
      ADMIN_PASSWORD: ci-admin-password
      SERVICE_ACCOUNT_EMAIL: notification-service@internal
      SERVICE_ACCOUNT_PASSWORD: ci-service-password

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      # --wait tam olarak calisiyor cunku compose'daki healthcheck'ler dogru
      # yazilmis: Flyway veritabanina yarisyamaz.
      - name: Start infrastructure
        run: docker compose up -d --wait

      - name: Run tests
        run: mvn -B verify
        working-directory: ${{ matrix.service }}

      # Kirmizi bir kosuda hangi testin neden dustugunu gormek icin.
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-${{ matrix.service }}
          path: ${{ matrix.service }}/target/surefire-reports/

      # Kapsam ozeti is ozetine yazilir: rapor indirilmeden GORULEBILMELI,
      # yoksa kimse acmaz ve olcum yapilmamis sayilir.
      - name: Summarise coverage
        if: always()
        run: |
          csv="${{ matrix.service }}/target/site/jacoco/jacoco.csv"
          [ -f "$csv" ] || exit 0
          awk -F, 'NR>1 {im+=$4; ic+=$5; bm+=$6; bc+=$7}
            END {
              printf "### %s\n\n", "${{ matrix.service }}"
              printf "| Olcut | Kapsam |\n|---|---|\n"
              printf "| Talimat | %.1f%% |\n", 100*ic/(ic+im)
              printf "| Dal | %.1f%% |\n", (bc+bm)>0 ? 100*bc/(bc+bm) : 0
            }' "$csv" >> "$GITHUB_STEP_SUMMARY"

      # ESIK YOK: kapsam yaniltici bir olcuttur ve bir sayiyi kapiya baglamak
      # insanlari iddiasiz test yazmaya iter. Rapor SAKLANIR ki kor noktalar
      # gozden gecirilebilsin.
      - name: Upload the coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.service }}
          path: ${{ matrix.service }}/target/site/jacoco/

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      # npm install DEGIL: kilit dosyasi otoritedir ve ayni commit her yerde
      # ayni agaci uretmelidir.
      - name: Install
        run: npm ci
        working-directory: frontend

      # Lint hicbir sey tarafindan cagrilmiyordu -- ne build, ne Dockerfile.
      # Fiilen istege bagliydi; artik degil.
      - name: Lint
        run: npm run lint
        working-directory: frontend

      # "tsc -b && vite build": tip hatasi derlemeyi dusurur.
      - name: Build
        run: npm run build
        working-directory: frontend

      - name: Test
        run: npm test
        working-directory: frontend

  # Servislerin BIRLIKTE calistigini dogrulayan tek is: giris, personel
  # olusturma, outbox, kuyruk, tuketici ve MailHog'a dusen mail.
  #
  # Bu is eklenene kadar e2e paketi kimse tarafindan kosturulmuyordu ve
  # ANLASILMADAN kirik kaldi: hazirlik kontrolu actuator'a bakiyordu, oysa
  # yonetim portu ayri bir porta tasinmisti. 19 test sessizce olmustu.
  #
  # Yerelde e2e ayri bir compose projesinde kosar (bkz. .env.e2e), cunku orada
  # bir gelistirme yigini ayakta ve testler kayit birakiyor. CI'da o ihtiyac
  # yok: kosucu her seferinde sifirdan basliyor ve .env dosyasi depoda degil.
  e2e:
    name: End-to-end
    runs-on: ubuntu-latest

    env:
      DB_USERNAME: ci
      DB_PASSWORD: ci
      RABBITMQ_USERNAME: ci
      RABBITMQ_PASSWORD: ci
      JWT_SECRET: Y2ktb25seS1rZXktbm90LWEtcmVhbC1zZWNyZXQtNDgtYnl0ZXMtcGFkZGluZyEh
      ADMIN_EMAIL: admin@example.com
      ADMIN_PASSWORD: ci-admin-password
      SERVICE_ACCOUNT_EMAIL: notification-service@internal
      SERVICE_ACCOUNT_PASSWORD: ci-service-password

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      # Arayuz baslatilmaz: bu testler tarayici degil HTTP kullanir.
      - name: Start the system
        run: |
          docker compose --profile full up -d --wait \
            postgres rabbitmq mailhog eureka-server employee-service notification-service

      - name: Run end-to-end tests
        run: mvn -B test
        working-directory: e2e

      # Kirmizi bir e2e kosusunda sucu servis loglari soyler; testin kendi
      # ciktisi yalnizca "beklenen 200, gelen 500" der.
      - name: Dump service logs
        if: failure()
        run: docker compose --profile full logs --no-color --tail 200

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-e2e
          path: e2e/target/surefire-reports/

  # Bagimliliklarin bilinen aciklari. Arayuzde `npm audit` zaten CI disinda
  # sifir donuyordu; arka ucta boyle bir kapi HIC yoktu.
  #
  # Haftada bir kosar, her commit'te degil: bir bagimliligin acigi kodla degil
  # ZAMANLA ortaya cikar -- dun temiz olan bugun degildir. Ayrica elle de
  # tetiklenebilir.
  security:
    name: Dependency vulnerabilities
    runs-on: ubuntu-latest
    # Her push'ta DEGIL: tarama pahalidir ve sonucu koda degil takvime bagli.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        service: [employee-service, notification-service, eureka-server]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      # NVD veritabani ~500 MB ve anahtarsiz indirmesi olculdu: ~35 dakika.
      # Onbellege alinmazsa bu is her kosuda o bedeli oder. Anahtar tanimliysa
      # guncelleme cok daha hizli; yoksa is yine calisir, sadece yavas.
      # Anahtar HAFTALIK doner. Iki tuzak birden var:
      #   - run_id kullanilsaydi tam eslesme HIC tutmaz ve her kosu ~1 GB'lik
      #     yeni bir onbellek yazardi; depo butcesi dolunca setup-java'nin
      #     Maven onbellekleri tahliye edilir ve diger isler yavaslardi.
      #   - Sabit anahtar da yanlis: actions/cache var olan anahtari
      #     GUNCELLEMEZ, yani veritabani sonsuza kadar bayat kalirdi.
      - name: Stamp the cache week
        id: week
        run: echo "stamp=$(date -u +%Y-%V)" >> "$GITHUB_OUTPUT"

      - name: Cache the vulnerability database
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository/org/owasp/dependency-check-data
          key: nvd-${{ steps.week.outputs.stamp }}
          # Onceki haftanin onbellegi geri yuklenir: guncelleme artimli olur.
          restore-keys: nvd-

      - name: Scan
        run: mvn -B dependency-check:check
        working-directory: ${{ matrix.service }}
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}

      - name: Upload the report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-check-${{ matrix.service }}
          path: ${{ matrix.service }}/target/dependency-check-report.html

  # Imajlarin GERCEKTEN derlenebildigini dogrular. Testler burada kosmaz
  # (altyapi gerektiriyorlar); bu adim yalnizca "Dockerfile bozulmus mu"
  # sorusunu cevaplar.
  images:
    name: Docker images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build images
        run: docker compose --profile full build
        env:
          # Compose zorunlu degiskenleri ${VAR:?} ile koruyor; derleme icin
          # gecerli olmalari yeterli, gercek olmalari gerekmiyor.
          DB_USERNAME: ci
          DB_PASSWORD: ci
          RABBITMQ_USERNAME: ci
          RABBITMQ_PASSWORD: ci
          JWT_SECRET: Y2ktb25seS1rZXktbm90LWEtcmVhbC1zZWNyZXQtNDgtYnl0ZXMtcGFkZGluZyEh
          ADMIN_EMAIL: admin@example.com
          ADMIN_PASSWORD: ci-admin-password
          SERVICE_ACCOUNT_EMAIL: notification-service@internal
          SERVICE_ACCOUNT_PASSWORD: ci-service-password

# Eureka Server ayarlari

server:
  port: 8761        # Eureka'nin standart portu. Panele http://localhost:8761 ile bakarsin.
  # Diger iki servisle es: SIGTERM gelince ucustaki istekler bitirilir.
  # Eksikligi tutarsizlikti -- kayit defteri de dagitim sirasinda yarida
  # kesilebiliyordu.
  shutdown: graceful

spring:
  # Kapanma butcesi: compose'daki stop_grace_period bundan UZUN olmali,
  # yoksa JVM isini bitiremeden SIGKILL yer ve zarif kapanma kagit uzerinde kalir.
  lifecycle:
    timeout-per-shutdown-phase: 20s
  application:
    name: eureka-server   # Servisin Eureka uzerindeki adi.

eureka:
  client:
    # Eureka'nin kendisi bir servis degil, rehber. O yuzden kendini kaydetmesin
    # ve kendi rehberinden kayit cekmesin diyoruz.
    register-with-eureka: false
    fetch-registry: false
  server:
    # AC/KAPA disaridan verilir ve varsayilan ACIK.
    #
    # Kapali oldugunda ag dalgalanmasi SAGLIKLI kopyalari kayittan dusurur:
    # kalp atisi gecikince Eureka onlari olmus sayar ve istekler ulasamaz hale
    # gelir. Gelistirmede kapali olmasi isteniyordu (servis durunca hemen
    # dussun) ama kosulsuzdu -- dev profili artik acikca kapatiyor.
    enable-self-preservation: ${EUREKA_SELF_PRESERVATION:true}

management:
  # Yonetim ucu AYRI PORTTA ve compose'da yayimlanmiyor. Onceden 8761'de
  # duruyordu ve o port disari acik: /actuator/info surum ile TAM JVM
  # yapisini kimlik dogrulamasi olmadan veriyordu. Diger iki serviste ayni
  # karar zaten uygulanmisti.
  server:
    port: 9090
  endpoints:
    web:
      exposure:
        # Yalnizca gerekenler acilir; "*" ortam degiskenlerini ve bellek
        # dokumunu disariya acardi.
        include: health,info
  # /actuator/info'nun ICINI dolduran kaynaklar. build-info hedefi olmadan
  # uc aciktir ama bos doner -- "hangi surum calisiyor" sorusu cevapsiz kalir.
  info:
    build:
      enabled: true
    java:
      enabled: true
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true

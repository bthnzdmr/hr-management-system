# Eureka Server ayarlari

server:
  port: 8761        # Eureka'nin standart portu. Panele http://localhost:8761 ile bakarsin.

spring:
  application:
    name: eureka-server   # Servisin Eureka uzerindeki adi.

eureka:
  client:
    # Eureka'nin kendisi bir servis degil, rehber. O yuzden kendini kaydetmesin
    # ve kendi rehberinden kayit cekmesin diyoruz.
    register-with-eureka: false
    fetch-registry: false
  server:
    # Gelistirme ortaminda "self-preservation" modunu kapatiyoruz ki
    # servisler durunca rehberden hizlica dussunler (lokalde daha net gorursun).
    enable-self-preservation: false

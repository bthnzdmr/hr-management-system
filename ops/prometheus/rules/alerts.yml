# Uyari kurallari. Adresler konteyner icidir; panele host'ta 9091'den bakilir.
#
# NEDEN: tasarim notlari "DLQ'nun tuketicisi yok, elle inceleme yeterli" diyerek
# riski kabul etmisti. Ama "elle inceleme", birinin panoyu acmayi hatirlamasi
# demektir -- ve hatirlanmadigi olculdu: bu dosya yazilirken DLQ'da fark
# edilmemis 16 mesaj duruyordu.
#
# Alertmanager ARTIK VAR (ops/alertmanager) ve bildirimler MailHog'a mail
# olarak dusuyor. Onceki hali "Alertmanager yok, uyarilar kimseye ulasmiyor"
# diyordu; o cumle dogruydu ama artik degil.
#
# Kanal MailHog cunku yiginda zaten var: bildirimin gercekten ulastigi uctan
# uca dogrulanabiliyor. Gercek bir dagitimda kurumun kendi SMTP'si yazilir.
groups:
  - name: messaging
    rules:
      # DLQ'da mesaj olmasi normal DEGILDIR: oraya ancak retry hakki bitmis
      # bir olay duser ve o olayin maili hic gitmemistir.
      - alert: DeadLetterQueueNotEmpty
        expr: rabbitmq_queue_messages{queue=~".*\\.dlq"} > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.queue }} kuyrugunda {{ $value }} olu mesaj var"
          description: >
            Retry hakki biten olaylar burada bekliyor ve bildirimleri hic
            gitmedi. Sebep x-exception-message basliginda yazili.

      # Tuketici durmus ya da yavassa kuyruk birikir. Esik sifir DEGIL:
      # anlik birikme normaldir, SUREKLI birikme degil.
      - alert: NotificationQueueBacklog
        expr: rabbitmq_queue_messages{queue=~".*\\.notification\\.queue"} > 50
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.queue }} birikiyor ({{ $value }} mesaj)"

  - name: outbox
    rules:
      # OutboxMetrics'in olctugu "en eski bekleyen olayin yasi". Ortalama
      # degil: "relay su anda ne kadar geride" sorusunun cevabi budur.
      - alert: OutboxRelayFallingBehind
        expr: hr_outbox_publish_lag_seconds > 120
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Outbox relay geride: en eski olay {{ $value }} sn bekliyor"
          description: >
            Broker erisilemez olabilir ya da relay durmus olabilir. Olaylar
            kaybolmaz, yayinlanmaz.

  - name: enrichment
    rules:
      # OLCULEN OLAY: httpclient5 tek basina yukseltilince Feign kirildi,
      # Eureka kaydi tazelenemedi ve yonetici aramasi her seferinde basarisiz
      # oldu. Mail YINE GITTI, yalnizca CC bostu -- yani ariza tamamen
      # sessizdi. Log'da WARN vardi ve kimse bakmiyordu; konteynerler de
      # `healthy` raporluyordu cunku saglik kontrolu Feign'i yoklamiyor.
      #
      # Esik SIFIR DEGIL: dagitim sirasinda employee-service yeniden
      # baslarken birkac cagri dusebilir ve bu normaldir. Kuyruk birikme
      # kuralindaki gerekcenin aynisi -- gurultulu uyari, gormezden gelinen
      # uyaridir.
      #
      # Hic cagri yapilmiyorsa bu kural SESSIZDIR ve bu dogrudur: tuketicinin
      # tamamen durmasini TargetDown ve NotificationQueueBacklog yakalar.
      - alert: ManagerLookupFailing
        expr: sum(increase(hr_manager_lookup_total{outcome="failed"}[30m])) > 3
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Yonetici aramasi basarisiz ({{ $value | printf \"%.0f\" }} kez / 30 dk)"
          description: >
            Bildirim mailleri yoneticiye CC atilmadan gidiyor. Servisler arasi
            cagri (Feign) ya da servis kesfi bozulmus olabilir; mail teslimi
            etkilenmedigi icin bu ariza kendini baska turlu belli etmez.

  - name: availability
    rules:
      # Cekme modelinin asil kazanci: kazima basarisiz olur ve BU KENDISI bir
      # sinyaldir. Gonderim modelinde cokmus bir servis yalnizca SUSARDI ve
      # "veri yok" ile "saglikli" ayirt edilemezdi.
      - alert: TargetDown
        expr: up == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.job }} kazinamiyor"
